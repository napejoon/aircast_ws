name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: signalling server + end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt -r tools/requirements.txt
      - name: Test
        # tools/ carries the end-to-end test: two real WebRTC peers pair through
        # the real server and decoded video has to move.
        run: pytest server tools -q --asyncio-mode=auto

  receiver:
    name: receiver (GTK4 + GStreamer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        # gtk4paintablesink is a *runtime* dependency, so it is deliberately not
        # installed here — this job answers "does it compile and link", which is
        # the question no developer machine in this project can answer locally.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libjson-glib-dev libsoup-3.0-dev
      - name: Build
        run: |
          cmake -S receiver -B receiver/build -DCMAKE_C_FLAGS="-Wall -Werror"
          cmake --build receiver/build

  sender:
    name: sender (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore the scaffold
        # The generated platform scaffold is not committed; `flutter create`
        # fills it in without touching the files that are.
        working-directory: sender
        run: |
          flutter create --platforms=android,ios --org io.aircast --project-name aircast_sender .
          # The scaffold drops in a widget test for a MyApp that is not ours.
          rm -f test/widget_test.dart
      - name: Analyse
        working-directory: sender
        run: |
          flutter pub get
          flutter analyze
      - name: Test
        working-directory: sender
        run: flutter test

  android:
    name: sender (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore the scaffold
        working-directory: sender
        run: flutter create --platforms=android --org io.aircast --project-name aircast_sender .
      - name: Pin the SDK levels
        # flutter_webrtc needs minSdk 23, and androidx.fragment refuses to be
        # compiled against anything below 36. Cheaper than committing a patched
        # gradle file that the scaffold would have to merge with.
        working-directory: sender/android/app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' build.gradle.kts
          grep -E 'minSdk|compileSdk' build.gradle.kts
      - name: Build
        working-directory: sender
        run: flutter build apk --debug

  paintablesink:
    name: gtk4paintablesink (the plugin apt does not ship)
    runs-on: ubuntu-24.04
    env:
      # 0.13 is the series built against GStreamer 1.24, which is what Ubuntu
      # 24.04 ships. Raising this without raising the runner's GStreamer is how
      # you get a plugin that refuses to load.
      PLUGINS_RS_TAG: "0.13.7"
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      # A long build whose inputs never move: a pinned tag and a pinned image.
      # Uncached, this job would dominate every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            gst-plugins-rs/target
          key: paintablesink-${{ runner.os }}-${{ env.PLUGINS_RS_TAG }}
      - name: Build
        run: |
          command -v cargo-cbuild >/dev/null || cargo install cargo-c --locked
          test -d gst-plugins-rs || git clone --depth 1 --branch "$PLUGINS_RS_TAG" https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git
          cd gst-plugins-rs
          cargo cbuild -p gst-plugin-gtk4 --release
          sudo -E $(command -v cargo) cinstall -p gst-plugin-gtk4 --release --prefix=/usr/local
      - name: Register
        # The question this job exists to answer: having built it, does
        # GStreamer actually find and load it?
        run: |
          export GST_PLUGIN_PATH=/usr/local/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/local/lib/gstreamer-1.0
          gst-inspect-1.0 gtk4paintablesink
