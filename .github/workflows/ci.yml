name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded branch build is wasted work; a superseded tag build is a lost
  # release, so tags are never cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  server:
    name: signalling server + end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r server/requirements.txt -r tools/requirements.txt
      - name: Test
        # tools/ carries the end-to-end test: two real WebRTC peers pair through
        # the real server and decoded video has to move.
        run: pytest -q

  receiver:
    name: receiver (GTK4 + GStreamer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install
        # gtk4paintablesink is a *runtime* dependency, so it is deliberately not
        # installed here — this job answers "does it compile and link", which is
        # the question no developer machine in this project can answer locally.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libjson-glib-dev libsoup-3.0-dev libsodium-dev libqrencode-dev
      - name: Build
        run: |
          cmake -S receiver -B receiver/build -DCMAKE_C_FLAGS="-Wall -Werror"
          cmake --build receiver/build
      - name: Self-test
        # Version comparison (the rollback defence) and the signature verifier,
        # exercised against a throwaway key rather than described.
        run: ./receiver/build/aircast-receiver --selftest

  sender:
    name: sender (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Restore the scaffold
        # The generated platform scaffold is not committed; the script fills it
        # in without touching the files that are, and applies the gradle patches
        # the Android jobs and release.yml all depend on.
        run: bash tools/scaffold-sender.sh
      - name: Analyse
        working-directory: sender
        run: |
          flutter pub get
          flutter analyze
      - name: Test
        working-directory: sender
        run: flutter test

  android:
    name: sender (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Restore the scaffold
        run: bash tools/scaffold-sender.sh
      - name: Build
        # Debug, because this is the APK a maintainer hands someone to try: the
        # release build is unsigned by design and Android will not install it.
        # Renamed, because app-debug.apk says nothing on the recipient's phone.
        working-directory: sender
        run: |
          flutter build apk --debug
          mv build/app/outputs/flutter-apk/app-debug.apk Quoise-debug.apk
      - name: The release path release.yml depends on
        # Built and thrown away. This is where R8, resource shrinking and the
        # AOT compiler run, and where AGP's -unsigned rename — the gate that
        # keeps a debug-keyed APK out of a release — is proved to still happen.
        # Without it the first --release build of this project would be the one
        # on the tag, in the job that has to succeed for the MSI to ship.
        working-directory: sender
        run: |
          flutter build apk --release
          test -f build/app/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        # Pushes only: on a pull_request this job builds the contributor's code,
        # and an installable APK published under this repository's Actions tab
        # is one this repository did not write.
        if: github.event_name == 'push'
        with:
          name: quoise-debug-apk
          path: sender/Quoise-debug.apk
          if-no-files-found: error

  paintablesink:
    name: gtk4paintablesink (the plugin apt does not ship)
    runs-on: ubuntu-24.04
    env:
      # 0.13 is the series built against GStreamer 1.24, which is what Ubuntu
      # 24.04 ships. Raising this without raising the runner's GStreamer is how
      # you get a plugin that refuses to load.
      PLUGINS_RS_TAG: "0.13.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools
      # A long build whose inputs never move: a pinned tag and a pinned image.
      # Uncached, this job would dominate every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/plugins-rs-target
          key: paintablesink-${{ runner.os }}-${{ env.PLUGINS_RS_TAG }}
      - name: Build
        run: |
          # Deliberately not "command -v cargo-cbuild || install": a restored
          # cache entry is an unreviewed binary, and this is the job that builds
          # a plugin the receiver loads.
          cargo install cargo-c --locked --force
          # Always a fresh clone: the cache used to restore gst-plugins-rs/target,
          # which made the directory exist, which skipped the clone, which left
          # cargo with no Cargo.toml. The build cache lives outside the tree now.
          rm -rf gst-plugins-rs
          git clone --depth 1 --branch "$PLUGINS_RS_TAG" https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git
          cd gst-plugins-rs
          export CARGO_TARGET_DIR="$HOME/plugins-rs-target"
          cargo cbuild -p gst-plugin-gtk4 --release
          sudo -E $(command -v cargo) cinstall -p gst-plugin-gtk4 --release --prefix=/usr/local
      - name: Register
        # The question this job exists to answer: having built it, does
        # GStreamer actually find and load it?
        run: |
          export GST_PLUGIN_PATH=/usr/local/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/local/lib/gstreamer-1.0
          gst-inspect-1.0 gtk4paintablesink

  windows:
    name: receiver (Windows bundle + MSI)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep MSYS2 tools away from CRLF
        shell: bash
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          # The default is MINGW64, which upstream has deprecated.
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p ntldd:p
            gtk4:p gstreamer:p gst-plugins-base:p gst-plugins-good:p
            gst-plugins-bad:p gst-plugins-bad-libs:p gst-plugins-rs:p
            gst-libav:p json-glib:p libsoup3:p glib-networking:p libsodium:p
            adwaita-icon-theme:p qrencode:p

      - name: Version
        # The tag is the only source of truth. A non-tag build stamps 0.0.0, so
        # every real release compares newer than anything CI produced by hand.
        run: |
          # On the ref TYPE, not on the name: a branch called v2-something is
          # not a release, and matching the name stamped its suffix as a version.
          V=0.0.0
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: |
          which cmake   # must be /ucrt64/bin/cmake, not the runner's
          cmake -S receiver -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIRCAST_VERSION="$VERSION"
          cmake --build build

      - name: The plugins with no fallback
        # gtk4paintablesink is how anything reaches the screen, and vp8dec is
        # the floor for phones libwebrtc will not let send H.264. Missing either
        # is a black window, not an error.
        run: |
          gst-inspect-1.0 gtk4paintablesink > /dev/null
          gst-inspect-1.0 vp8dec > /dev/null

      - name: Self-test
        run: ./build/aircast-receiver.exe --selftest

      - name: Bundle
        run: bash tools/bundle-windows.sh build dist/aircast

      - name: Smoke test the bundle
        # No MSYS2 on PATH and a poisoned XDG_DATA_DIRS: this is the machine the
        # user has, plus the one environment variable that silently breaks the
        # bundle. Loading the plugins pulls in the whole DLL closure.
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:XDG_DATA_DIRS = "C:\nope"
          cd dist\aircast\bin
          foreach ($e in 'gtk4paintablesink','vp8dec','webrtcbin','rtph264depay','h264parse','matroskamux') {
            .\gst-inspect-1.0.exe $e > $null
            if ($LASTEXITCODE -ne 0) { throw "missing element: $e" }
          }

      - name: Build MSI
        shell: pwsh
        run: |
          # WiX v7 refuses to run until the Open Source Maintenance Fee EULA is
          # accepted, and accepting it is documented as following payment. v5 is
          # the last series without that gate, and it has the <Files> harvesting
          # this installer is built on.
          dotnet tool install --global wix --version 5.0.2
          # The dialogs are an extension, not part of the toolset, and its
          # version has to track wix's own or the build refuses to load it.
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build installer/aircast.wxs -arch x64 -ext WixToolset.UI.wixext -d Ver=$env:VERSION -d Stage=dist/aircast -o "Quoise-$env:VERSION-x64.msi"
          # wix build runs no ICEs of its own. ICE105 is the dual-purpose-package
          # gate, and whether <Files> harvesting passes it is unsourced — so it
          # is a CI step rather than an assumption.
          wix msi validate -ice ICE105 "Quoise-$env:VERSION-x64.msi"
          # A harvest that finds nothing is a warning, not an error, and produces
          # a 35 KB installer that installs a program which cannot start. The
          # bundle is ~170 MB since the plugin prune; anything under 40 MB
          # means harvesting broke. The floor was 100 MB when 299 plugins
          # shipped and the MSI was 133; it is 67 now, and a floor that has
          # to be revisited after every prune is one nobody trusts. 40 is
          # far above the 35 KB an empty harvest produces, which is the only
          # failure this number exists to catch.
          $msi = Get-Item "Quoise-$env:VERSION-x64.msi"
          "MSI: {0:N0} MB" -f ($msi.Length / 1MB)
          if ($msi.Length -lt 40MB) { throw "MSI is $($msi.Length) bytes — harvesting found nothing" }

      - name: The registry the installer prebuilds
        # After the MSI is built, deliberately: the harvest globs the staging
        # tree, and a registry.bin sitting there would ship inside the package
        # carrying this runner's paths.
        #
        # This is the one part of the installer an administrative install does
        # not exercise -- msiexec /a extracts files and runs no custom actions --
        # so CI runs the same command the custom action runs and then checks
        # that the program reads what it wrote, rather than falling back to the
        # per-user cache in %LOCALAPPDATA%.
        run: |
          ./dist/aircast/bin/aircast-receiver.exe --prebuild-registry
          test -s dist/aircast/registry.bin
          GST_DEBUG=GST_REGISTRY:4 ./dist/aircast/bin/aircast-receiver.exe --selftest 2>&1             | grep -q 'reading registry cache:.*aircast.registry\.bin'
          rm dist/aircast/registry.bin

      - name: The layout the MSI actually installs
        shell: pwsh
        # Size proves the harvest found bytes, not that it put them anywhere
        # useful: the exe was declared at the install root while every DLL
        # harvested into bin\, which installs a program that cannot start. The
        # smoke test cannot catch it — it looks at the staged tree, which was
        # always right. An administrative install extracts the real layout
        # without installing anything or needing elevation.
        run: |
          $msi = (Get-Item "Quoise-$env:VERSION-x64.msi").FullName
          $dir = Join-Path $PWD "extracted"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "administrative install failed with $($p.ExitCode)" }
          $exe = Get-ChildItem $dir -Recurse -Filter aircast-receiver.exe | Select-Object -First 1
          if (-not $exe) { throw "the package contains no aircast-receiver.exe" }
          # Static imports: the loader takes these from the exe's own directory.
          foreach ($pat in 'libgtk-4-*.dll', 'libgstreamer-1.0-*.dll') {
            if (-not (Get-ChildItem $exe.Directory.FullName -Filter $pat)) {
              throw "$pat is not beside the installed exe ($($exe.Directory.FullName))"
            }
          }
          # And the schemas, which main.c reaches by walking up out of bin.
          $root = Split-Path $exe.Directory.FullName -Parent
          $schemas = Join-Path $root "share\glib-2.0\schemas\gschemas.compiled"
          if (-not (Test-Path $schemas)) { throw "no compiled schemas at $schemas" }
          "installed exe: $($exe.FullName)"
          # An administrative install also drops a copy of the package itself in
          # TARGETDIR, so the extraction cannot be left where the upload globs.
          Remove-Item $dir -Recurse -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quoise-msi
          path: Quoise-*-x64.msi
