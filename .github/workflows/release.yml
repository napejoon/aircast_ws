# Tag -> draft release. Publishing is a human step, and so is signing.
#
# This workflow deliberately cannot finish a release: it produces the installer,
# attests it, and leaves a DRAFT. The maintainer then downloads the MSI, hashes
# it locally, writes and signs aircast-update.json on an offline machine, and
# publishes. The signing key never enters Actions, which is the one property
# that survives a compromise of this repository — see docs/threat-model.md.
#
# Every `uses:` is pinned to a commit SHA: a tag is a moving reference, and the
# job that mints the attestation is where that matters most.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep MSYS2 tools away from CRLF
        shell: bash
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          # No cache restore in a job that produces a release artifact: a
          # poisoned cache entry is an unreviewed input to the thing we attest.
          cache: false
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p ntldd:p
            gtk4:p gstreamer:p gst-plugins-base:p gst-plugins-good:p
            gst-plugins-bad:p gst-plugins-bad-libs:p gst-plugins-rs:p
            gst-libav:p json-glib:p libsoup3:p glib-networking:p libsodium:p
            adwaita-icon-theme:p qrencode:p

      - name: Version
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S receiver -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIRCAST_VERSION="$VERSION"
          cmake --build build

      - name: Self-test
        run: ./build/aircast-receiver.exe --selftest

      - name: Bundle
        run: bash tools/bundle-windows.sh build dist/aircast

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:XDG_DATA_DIRS = "C:\nope"
          cd dist\aircast\bin
          foreach ($e in 'gtk4paintablesink','vp8dec','webrtcbin','rtph264depay','h264parse','matroskamux') {
            .\gst-inspect-1.0.exe $e > $null
            if ($LASTEXITCODE -ne 0) { throw "missing element: $e" }
          }

      - name: Build MSI
        shell: pwsh
        run: |
          # v5 is the last series before WiX gated every command behind the
          # Open Source Maintenance Fee EULA. See ci.yml.
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix build installer/aircast.wxs -arch x64 -ext WixToolset.UI.wixext -d Ver=$env:VERSION -d Stage=dist/aircast -o "Quoise-$env:VERSION-x64.msi"
          wix msi validate -ice ICE105 "Quoise-$env:VERSION-x64.msi"
          # A harvest that finds nothing is a warning, not an error, and produces
          # a 35 KB installer that installs a program which cannot start. The
          # bundle is ~350 MB; anything under 100 MB means harvesting broke.
          $msi = Get-Item "Quoise-$env:VERSION-x64.msi"
          "MSI: {0:N0} MB" -f ($msi.Length / 1MB)
          if ($msi.Length -lt 100MB) { throw "MSI is $($msi.Length) bytes — harvesting found nothing" }

      - name: The layout the MSI actually installs
        shell: pwsh
        # The one check that looks at what a user ends up with rather than at
        # what we staged. See ci.yml.
        run: |
          $msi = (Get-Item "Quoise-$env:VERSION-x64.msi").FullName
          $dir = Join-Path $PWD "extracted"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "administrative install failed with $($p.ExitCode)" }
          $exe = Get-ChildItem $dir -Recurse -Filter aircast-receiver.exe | Select-Object -First 1
          if (-not $exe) { throw "the package contains no aircast-receiver.exe" }
          foreach ($pat in 'libgtk-4-*.dll', 'libgstreamer-1.0-*.dll') {
            if (-not (Get-ChildItem $exe.Directory.FullName -Filter $pat)) {
              throw "$pat is not beside the installed exe ($($exe.Directory.FullName))"
            }
          }
          $root = Split-Path $exe.Directory.FullName -Parent
          $schemas = Join-Path $root "share\glib-2.0\schemas\gschemas.compiled"
          if (-not (Test-Path $schemas)) { throw "no compiled schemas at $schemas" }
          "installed exe: $($exe.FullName)"
          # The extraction is a copy of the whole bundle; upload-artifact globs
          # the working directory, so it must not be left lying next to the MSI.
          Remove-Item $dir -Recurse -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msi
          path: Quoise-*-x64.msi
          if-no-files-found: error

  apk:
    name: Sender APK (unsigned)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Restore the scaffold
        # Same script ci.yml runs, which is the point: the patch that strips the
        # scaffold's debug signingConfig is exercised on every push, not first on
        # the tag that ships.
        run: bash tools/scaffold-sender.sh

      - name: Version
        # versionCode is an integer Android only ever lets go up, and it is
        # packed the way receiver/update_check.c already packs a version:
        # a*1e6 + b*1e3 + c, fields capped at 999. One rule for both halves of a
        # release, so they cannot disagree about which build is newer.
        #
        # The tag is validated rather than parsed leniently: `IFS=. read` turns
        # v1.0.0-rc1 into the same code as v1.0.0 without saying a word, and an
        # Android version code that repeats is an update users cannot install.
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || {
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z with fields <= 999" >&2
            exit 1
          }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "CODE=$((10#${BASH_REMATCH[1]} * 1000000 \
                      + 10#${BASH_REMATCH[2]} * 1000 \
                      + 10#${BASH_REMATCH[3]}))" >> "$GITHUB_ENV"

      - name: Build
        working-directory: sender
        # Neither name reaches Gradle any other way: it reads both out of
        # android/local.properties, which only a flutter invocation writes.
        run: flutter build apk --release --build-name="$VERSION" --build-number="$CODE"

      - name: Collect
        working-directory: sender
        # Gradle names the file for what it is, and only names it that when no
        # signingConfig survived the scaffold script — so this is the second gate
        # against a debug-keyed APK reaching a release. It has to say which
        # failure it is, though: "gradle moved the file" and "the release is
        # debug-keyed and this just saved you" are the same missing path.
        run: |
          APK=build/app/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || {
            echo "no unsigned APK — gradle produced:" >&2
            ls -l build/app/outputs/apk/release/ >&2
            exit 1
          }
          mv "$APK" "$GITHUB_WORKSPACE/Quoise-$VERSION-unsigned.apk"

      - name: Not an empty box
        # The MSI job's size check, for an APK. This is the first build in which
        # R8, resource shrinking and the AOT compiler all run; a build that lost
        # the Dart snapshot still zips up fine, still installs, and shows
        # nothing. libapp.so exists only in an AOT build.
        run: |
          APK="Quoise-$VERSION-unsigned.apk"
          ls -l "$APK"
          for so in libapp.so libflutter.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$so" || { echo "APK contains no $so"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk
          path: Quoise-*-unsigned.apk
          if-no-files-found: error

  attest:
    name: Attest provenance
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      # This job contains no project code on purpose: it downloads the exact
      # artifacts that will be released and does one thing to them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: msi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          # This covers the bytes that go *into* apksigner, not the signed APK a
          # user installs: signing changes the digest, and it happens on a
          # machine Actions cannot reach.
          subject-path: |
            Quoise-*-x64.msi
            Quoise-*-unsigned.apk

  draft:
    name: Draft release
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: msi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: apk
      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          Windows will show "Windows protected your PC" — the installer is not
          code-signed. Click **More info -> Run anyway**, or do not install it.

          Any asset here whose name ends `-unsigned.apk` cannot be installed:
          Android refuses an unsigned package. It is the input to the
          maintainer's offline signing step, and the signed
          `Quoise-<version>.apk` replaces it before this release is
          published.

          This bundle redistributes GLib, GTK and GStreamer under the LGPL; the
          corresponding sources are the MSYS2 packages named in
          `tools/bundle-windows.sh`.
          NOTES
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # It stays a draft until a human has verified the attestation, hashed the
        # MSI locally and signed the manifest offline. Publishing from CI would
        # make the Actions token enough to ship an update notice, which is
        # exactly what the offline key exists to prevent.
        run: |
          gh release create "$TAG" Quoise-*-x64.msi Quoise-*-unsigned.apk \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --notes-file notes.md
