# A debug APK pointed at a signalling server of your choosing, built on demand
# from the Actions tab.
#
# The committed defaults cannot know either of these: main.dart falls back to
# wss://localhost:8443/ws, which on a tablet means the tablet, and session.dart
# forces ICE through our own TURN, which a LAN bring-up does not have. Both are
# compile-time constants — String.fromEnvironment is resolved by the Dart
# compiler — so pointing an APK somewhere else means building another APK.
#
# Debug on purpose: a release build is unsigned by design and Android will not
# install it. This is a bring-up tool, not a release path.
name: Sender APK (bring-up)

on:
  workflow_dispatch:
    inputs:
      signal:
        description: "AIRCAST_SIGNAL — ws://192.168.1.20:8443/ws, or wss://host/ws"
        required: true
        type: string
      relay:
        description: "AIRCAST_RELAY — true forces every packet through coturn; false (the shipped default) lets ICE take a direct pair when it can"
        required: true
        type: choice
        options: ["true", "false"]
        default: "false"

permissions:
  contents: read

jobs:
  apk:
    name: debug APK for ${{ inputs.signal }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Restore the scaffold
        run: bash tools/scaffold-sender.sh

      - name: Build
        working-directory: sender
        # The inputs reach the shell as environment variables rather than being
        # pasted into the script: a `run:` block with ${{ }} in it runs whatever
        # the person dispatching typed.
        env:
          SIGNAL: ${{ inputs.signal }}
          RELAY: ${{ inputs.relay }}
        run: |
          case "$SIGNAL" in
            ws://*|wss://*) ;;
            *) echo "AIRCAST_SIGNAL must start with ws:// or wss:// — got '$SIGNAL'" >&2; exit 1 ;;
          esac
          flutter build apk --debug \
            --dart-define=AIRCAST_SIGNAL="$SIGNAL" \
            --dart-define=AIRCAST_RELAY="$RELAY"
          mv build/app/outputs/flutter-apk/app-debug.apk Quoise-bringup.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aircast-sender-bringup-apk
          path: sender/Quoise-bringup.apk
          if-no-files-found: error
