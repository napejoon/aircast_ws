# TURNS and HTTPS share 443 on one IPv4. Install as
# /etc/nginx/stream.d/aircast-443.conf (Ubuntu's nginx.conf on this box has a
# top-level `stream { include /etc/nginx/stream.d/*.conf; }`), and move every
# HTTPS vhost's `listen 443 ssl` to
#
#     listen 127.0.0.1:8444 ssl proxy_protocol;
#     set_real_ip_from 127.0.0.1;
#     real_ip_header proxy_protocol;
#
# Then RESTART nginx, not reload: the old worker holds 443 as an http socket and
# the new config wants it as a stream socket, so a reload logs "bind() to
# 0.0.0.0:443 failed (98: Address already in use) … still could not bind()"
# and quietly keeps running the old configuration. `nginx -t` passes either way
# and is not proof. `ss -lntp | grep 127.0.0.1:8444` is.
#
# Why this exists: a university network dropped UDP/3478, UDP/443 and TLS/5349
# outright — coturn never saw a packet — while HTTPS to the same host worked.
# TCP/443 is the one port a captive-portal network cannot close, because its
# own sign-in page uses it. RFC 6455 §1.1 says WebSocket looks the way it does
# for the same reason.
#
# nginx reads the SNI out of the ClientHello without terminating TLS and hands
# turn.<DOMAIN> to coturn, everything else to the HTTPS vhosts. coturn keeps
# its own certificate and its own 5349 listener for networks that allow it.
#
# Every upstream gets a PROXY protocol header so the vhosts still see real
# client addresses: the signalling throttle buckets by client and would
# otherwise see 127.0.0.1 for the whole internet. coturn cannot parse that
# header on its TLS listener, so its traffic takes one more loopback hop that
# strips it (8446). coturn does document --tcp-proxy-port for exactly this,
# but turning it on disables the normal TCP and TLS listeners, which is worse.
#
# Two names are load-bearing: with one SNI value nothing could tell a TURNS
# ClientHello from an HTTPS one — libwebrtc sends no ALPN and no API sets one.
#
# coturn needs two lines for this to work at all (ops/turnserver.conf.template):
#     listening-ip=127.0.0.1
#     relay-ip=<VPS_PUBLIC_IPV4>
# Without relay-ip, a client that arrived via loopback is handed 127.0.0.1 as
# its relay address and both ends report a healthy allocation that carries
# nothing.
#
# coturn's own docs never mention 443, nginx or SNI. This recipe is folklore
# that works; the checks above are what make it safe to rely on.
map $ssl_preread_server_name $aircast_443_upstream {
    <TURN_DOMAIN>       127.0.0.1:8446;
    default             127.0.0.1:8444;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_protocol on;
    proxy_pass $aircast_443_upstream;
    proxy_connect_timeout 5s;
    # A TURN allocation or a WebSocket sits idle between packets.
    proxy_timeout 10m;
}

# Strips the PROXY protocol header before coturn sees the bytes.
server {
    listen 127.0.0.1:8446 proxy_protocol;
    proxy_pass 127.0.0.1:5349;
    proxy_timeout 10m;
}
