name: kagami_sender
description: Screen sender for aircast (WebRTC over own TURN, plus an Android USB path).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.0
  # The pairing QR the receiver draws. MLKit on Android, which is where the
  # only sender that exists runs.
  mobile_scanner: ^7.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
